# The contents of this file is based on https://github.com/meshtastic/home-assistant/blob/main/.ruff.toml

target-version = "py313"
line-length = 120

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "D100", # Missing docstring
    "D101", # Missing docstring
    "D102", # Missing docstring
    "D103", # Missing docstring
    "D104", # Missing docstring
    "D105", # Missing docstring
    "D107", # Missing docstring
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are how pytest checks results
    "PLR2004", # magic values are fine in test data
    "ANN001", # pytest fixtures are injected without annotations
    "ANN201",
]
